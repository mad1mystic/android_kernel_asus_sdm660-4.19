name: Build X00TD DroidSpaces KSU
on:
  push:
    branches: [arena/*]
  workflow_dispatch:
permissions: write-all
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Install deps ravindu
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex pkg-config git curl tar xz-utils zip unzip cpio rsync kmod perl python3 python-is-python3 libssl-dev libelf-dev pahole libncurses-dev zlib1g-dev libyaml-dev lz4 zstd device-tree-compiler
      - name: Download clang-r416183b
        run: |
          mkdir -p ~/toolchains
          if [ ! -d ~/toolchains/clang-r416183b ]; then
            git clone --depth 1 https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b.git ~/toolchains/clang-r416183b
          fi
      - name: Clone kernel
        run: |
          git clone https://github.com/mad1mystic/android_kernel_asus_sdm660-4.19.git -b arena/01a0e3cd-android-kernel-asus-sdm660-4-1 kernel --depth 1
          cd kernel
          echo "Defconfig lines $(wc -l < arch/arm64/configs/vendor/asus/X00TD_defconfig)"
          grep -E "KSU|KPROBES|PID_NS" arch/arm64/configs/vendor/asus/X00TD_defconfig | head -n 10
      - name: Setup KSU-Next
        run: |
          cd kernel
          rm -rf KernelSU-Next drivers/kernelsu
          git clone --depth 1 https://github.com/KernelSU-Next/KernelSU-Next.git KernelSU-Next
          ln -sf ../KernelSU-Next/kernel drivers/kernelsu
          grep -q kernelsu drivers/Makefile || echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile
          grep -q drivers/kernelsu/Kconfig drivers/Kconfig || sed -i '/endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig
          ls drivers/kernelsu/Kconfig -lh
          cat drivers/Kconfig | tail -n 10
      - name: Build defconfig debug
        run: |
          cd kernel
          export PATH=$HOME/toolchains/clang-r416183b/bin:$PATH
          export ARCH=arm64
          set +e
          echo "=== Try defconfig without KSU ==="
          cp arch/arm64/configs/vendor/asus/X00TD_defconfig /tmp/X00TD_with_ksu
          sed -i '/CONFIG_KSU/d' arch/arm64/configs/vendor/asus/X00TD_defconfig
          make O=out ARCH=arm64 X00TD_defconfig 2>&1 | tee /tmp/defconfig-no-ksu.log
          echo "Exit no-ksu: ${PIPESTATUS[0]}" | tee -a /tmp/defconfig-no-ksu.log
          cat /tmp/defconfig-no-ksu.log | tail -n 100
          echo "=== Try defconfig with KSU ==="
          cp /tmp/X00TD_with_ksu arch/arm64/configs/vendor/asus/X00TD_defconfig
          rm -rf out
          make O=out ARCH=arm64 X00TD_defconfig 2>&1 | tee /tmp/defconfig-with-ksu.log
          echo "Exit with-ksu: ${PIPESTATUS[0]}" | tee -a /tmp/defconfig-with-ksu.log
          cat /tmp/defconfig-with-ksu.log | tail -n 200
          ls -lh out/.config 2>&1 || true
          # Combine logs for issue
          cat /tmp/defconfig-no-ksu.log > /tmp/combined.log
          echo "---WITH KSU---" >> /tmp/combined.log
          cat /tmp/defconfig-with-ksu.log >> /tmp/combined.log
          if [ ! -f out/.config ]; then
            echo "DEFCONFIG FAILED, creating issue"
            BODY=$(cat /tmp/combined.log | tail -c 50000 | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read()))')
            echo "{\"title\":\"defconfig failed $(date)\",\"body\":$BODY}" > /tmp/payload.json
            curl -s -X POST -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github.v3+json" https://api.github.com/repos/mad1mystic/android_kernel_asus_sdm660-4.19/issues -d @/tmp/payload.json | head -n 20
            echo "curl done"
            exit 1
          fi
      - name: Build Image.gz-dtb
        run: |
          cd kernel
          export PATH=$HOME/toolchains/clang-r416183b/bin:$PATH
          export ARCH=arm64
          make -j$(nproc) O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 Image.gz-dtb 2>&1 | tee /tmp/build.log
          ls -lh out/arch/arm64/boot/
      - name: Package AnyKernel3 OFOX
        run: |
          cd kernel
          IMG=out/arch/arm64/boot/Image.gz-dtb
          if [ ! -f $IMG ]; then echo "missing"; exit 1; fi
          git clone --depth 1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          cp $IMG AnyKernel3/
          cd AnyKernel3
          printf 'properties() {\n' > anykernel.sh
          printf 'kernel.string=X00TD DroidSpaces KSU-Next\n' >> anykernel.sh
          printf 'do.devicecheck=1\n' >> anykernel.sh
          printf 'do.modules=0\n' >> anykernel.sh
          printf 'do.systemless=0\n' >> anykernel.sh
          printf 'do.cleanup=1\n' >> anykernel.sh
          printf 'do.cleanuponabort=0\n' >> anykernel.sh
          printf 'device.name1=X00T\n' >> anykernel.sh
          printf 'device.name2=X00TD\n' >> anykernel.sh
          printf 'device.name3=Zenfone Max Pro M1\n' >> anykernel.sh
          printf 'device.name4=ASUS_X00TD\n' >> anykernel.sh
          printf 'supported.versions=\n' >> anykernel.sh
          printf 'supported.patchlevels=\n' >> anykernel.sh
          printf '}\n' >> anykernel.sh
          printf 'block=/dev/block/bootdevice/by-name/boot;\n' >> anykernel.sh
          printf 'is_slot_device=0;\n' >> anykernel.sh
          printf 'ramdisk_compression=auto;\n' >> anykernel.sh
          printf 'patch_vbmeta_flag=auto;\n' >> anykernel.sh
          printf '. tools/ak3-core.sh;\n' >> anykernel.sh
          printf 'dump_boot;\n' >> anykernel.sh
          printf 'write_boot;\n' >> anykernel.sh
          zip -r9 ../X00TD-DroidSpaces-KSU-Next-OFOX.zip * -x .git README.md *placeholder
          cd ..
          ls -lh *.zip
