name: Find failing DroidSpaces config
on:
  push:
    branches: [arena/*]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex pkg-config git curl tar xz-utils zip unzip cpio rsync kmod perl python3 python-is-python3 libssl-dev libelf-dev pahole libncurses-dev zlib1g-dev libyaml-dev lz4 zstd device-tree-compiler
      - name: Download clang-r416183b
        run: |
          mkdir -p ~/toolchains
          if [ ! -d ~/toolchains/clang-r416183b ]; then
            git clone --depth 1 https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b.git ~/toolchains/clang-r416183b
          fi
      - name: Clone rsuntk plain
        run: |
          git clone https://github.com/rsuntk/android_kernel_asus_sdm660-4.19.git -b master kernel --depth 1
          cd kernel
          cp arch/arm64/configs/vendor/asus/X00TD_defconfig /tmp/clean_defconfig
      - name: Test each DroidSpaces config
        run: |
          cd kernel
          export PATH=$HOME/toolchains/clang-r416183b/bin:$PATH
          export ARCH=arm64
          cat > /tmp/droidspaces_minimal.txt <<'EOF'
          CONFIG_SYSVIPC=y
          CONFIG_POSIX_MQUEUE=y
          CONFIG_NAMESPACES=y
          CONFIG_PID_NS=y
          CONFIG_UTS_NS=y
          CONFIG_IPC_NS=y
          CONFIG_NET_NS=y
          CONFIG_CGROUPS=y
          CONFIG_CGROUP_DEVICE=y
          CONFIG_CGROUP_PIDS=y
          CONFIG_MEMCG=y
          CONFIG_CGROUP_SCHED=y
          CONFIG_FAIR_GROUP_SCHED=y
          CONFIG_CGROUP_FREEZER=y
          CONFIG_DEVTMPFS=y
          CONFIG_OVERLAY_FS=y
          CONFIG_USER_NS=y
          CONFIG_SECCOMP=y
          CONFIG_SECCOMP_FILTER=y
          CONFIG_VETH=y
          CONFIG_BRIDGE=y
          CONFIG_KPROBES=y
          CONFIG_KSU=y
          EOF
          # Setup KSU driver for KSU test
          rm -rf KernelSU-Next drivers/kernelsu
          git clone --depth 1 https://github.com/KernelSU-Next/KernelSU-Next.git KernelSU-Next
          ln -sf ../KernelSU-Next/kernel drivers/kernelsu
          grep -q kernelsu drivers/Makefile || echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile
          grep -q drivers/kernelsu/Kconfig drivers/Kconfig || sed -i '/endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig
          # Test each config
          while IFS= read -r cfgline; do
            [ -z "$cfgline" ] && continue
            cfg=$(echo "$cfgline" | cut -d= -f1)
            echo "=== Testing $cfgline ==="
            cp /tmp/clean_defconfig arch/arm64/configs/vendor/asus/X00TD_defconfig
            # Remove existing
            sed -i "/^# $cfg is not set/d" arch/arm64/configs/vendor/asus/X00TD_defconfig
            sed -i "/^$cfg=/d" arch/arm64/configs/vendor/asus/X00TD_defconfig
            echo "$cfgline" >> arch/arm64/configs/vendor/asus/X00TD_defconfig
            rm -rf out
            make O=out ARCH=arm64 X00TD_defconfig 2>&1 | tail -n 20
            if [ $? -ne 0 ]; then
              echo "FAILED for $cfgline"
              make O=out ARCH=arm64 X00TD_defconfig 2>&1 | tail -n 50
            else
              echo "OK for $cfgline"
            fi
          done < /tmp/droidspaces_minimal.txt
          echo "=== Done testing individual ==="
          # Now test all together
          cp /tmp/clean_defconfig arch/arm64/configs/vendor/asus/X00TD_defconfig
          cat /tmp/droidspaces_minimal.txt >> arch/arm64/configs/vendor/asus/X00TD_defconfig
          rm -rf out
          make O=out ARCH=arm64 X00TD_defconfig 2>&1 | tail -n 100
          echo "Exit all together: $?"
          ls out/.config 2>&1 | head -n 5
