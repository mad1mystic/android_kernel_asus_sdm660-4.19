name: Build X00TD Mystic Kernel

# NOTE: this file intentionally uses the SAME path as master's
# .github/workflows/build-x00td.yml. GitHub keys workflow_dispatch on the path,
# so the "Run workflow" button stays available and you can pick this branch
# (mystic-ksu334) as the ref — master is left untouched.
#
# Kernel: Mystic Kernel for ASUS ZenFone Max Pro M1 (X00TD)
# Base:   rusakseven/RSKSevenProject-X00TD-419 @ rskseven-4.19
#         4.19.325 + OC 2.2 GHz (big cluster) + KernelSU-Next v3.2.0-legacy
#         + SuSFS v2.3.0, EAS, GPU locked 430 MHz
# Plus:   Droidspaces support (ravindu644/Droidspaces-OSS, non-GKI path)
#         + schedutil as the compiled-in default governor (battery)
#         + KernelSU-Next "legacy" HEAD 465490a26 (KSU 33314) with the RSKSeven
#           SuSFS v2.3.0 integration re-ported on top  [v1.3 feature parity]
#
# WHY KSU_VERSION IS PINNED BELOW:
#   The KSU source is vendored inside this kernel tree (KernelSU-Next-v340/kernel,
#   reached via the drivers/kernelsu symlink). Kbuild only trusts a git checkout
#   that is a *different* repo from the kernel; here it is the same repo, so the
#   autodetection falls through to KSU_VERSION_FALLBACK=1. The KernelSU-Next
#   manager enforces MINIMAL_SUPPORTED_KERNEL=33188 and would treat such a kernel
#   as unsupported (root dead on arrival). So the real version is pinned with
#   KSU_VERSION_OVERRIDE and verified after the build:
#       30000 + 289 (legacy offset) + 3025 (commit count of 465490a26) = 33314
on:
  workflow_dispatch:
    inputs:
      KERNEL_REF:
        description: 'Kernel ref to build (branch or commit in this repo)'
        default: 'mystic-ksu334'
      DS_PATCHES:
        description: 'Apply the Droidspaces non-GKI kernel patches'
        type: boolean
        default: true

permissions:
  contents: write

env:
  # Build from THIS fork, so the committed Droidspaces fragment is always used.
  KERNEL_REPO: https://github.com/mad1mystic/android_kernel_asus_sdm660-4.19

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout author's build scripts
        uses: actions/checkout@v5
        with:
          repository: rsuntk/asus_kernel_action
          path: authorci

      - name: Fetch kernel source
        run: |
          set -euo pipefail
          echo "Author scripts commit: $(git -C authorci rev-parse HEAD)"
          mkdir ksrc && cd ksrc
          git init -q
          git remote add origin "$KERNEL_REPO"
          git fetch --depth=1 origin "${{ inputs.KERNEL_REF }}"
          git checkout -q FETCH_HEAD
          echo "Kernel commit: $(git rev-parse HEAD)"
          for f in \
            arch/arm64/configs/vendor/asus/X00TD_defconfig \
            arch/arm64/configs/vendor/extra/ksu.config \
            arch/arm64/configs/vendor/extra/droidspaces.config ; do
            test -f "$f" || { echo "::error::missing $f — wrong ref?"; exit 1; }
          done
          echo "--- in-tree KernelSU-Next ---"
          ls drivers/kernelsu | head -5
          echo "--- OC marker ---"
          grep -n 'RSKSevenProject OC' drivers/clk/qcom/clk-cpu-osm-660.c || {
            echo "::error::OC speedbin marker missing — this is not the OC tree"; exit 1; }

      # KernelSU-Next ships in-tree as a real directory (KernelSU-Next-v340/kernel)
      # reached through the drivers/kernelsu symlink, with CONFIG_KSU=y in
      # vendor/extra/ksu.config. There is deliberately NO setup.sh step here: it
      # would write into drivers/kernelsu and collide with the vendored copy.

      - name: Apply Droidspaces non-GKI patches
        if: ${{ inputs.DS_PATCHES }}
        run: |
          set -euo pipefail
          git clone -q --depth=1 https://github.com/ravindu644/Droidspaces-OSS.git "$RUNNER_TEMP/ds"
          cd ksrc
          : > "$RUNNER_TEMP/skipped.txt"
          shopt -s nullglob
          found=0
          for p in "$RUNNER_TEMP"/ds/Documentation/resources/kernel-patches/non-GKI/*.patch; do
            found=1
            n=$(basename "$p")
            echo "== $n"
            if patch -p1 --dry-run -s < "$p" >/dev/null 2>&1; then
              patch -p1 < "$p"
            elif patch -R -p1 --dry-run -s < "$p" >/dev/null 2>&1; then
              echo "already applied, skipping"
            else
              # Distinguish "this tree doesn't have that feature" (safe to skip)
              # from "the hunk really failed to apply" (NOT safe to skip).
              tgts=$(grep -E '^(---|\+\+\+) ' "$p" \
                | sed -E 's#^(---|\+\+\+) ##; s#^[ab]/##; s#[[:space:]].*$##' \
                | grep -vE '^(/dev/null)?$' | sort -u || true)
              miss=0
              echo "   files this patch touches:"
              while read -r f; do
                [ -n "$f" ] || continue
                if [ -f "$f" ]; then echo "     exists : $f"; else echo "     MISSING: $f"; miss=$((miss+1)); fi
              done <<< "$tgts"
              echo "   dry-run output:"
              patch -p1 --dry-run < "$p" 2>&1 | head -n 10 | sed 's/^/     /' || true
              if [ "$miss" != 0 ]; then
                echo "::warning::Skipped $n — this tree has no target file for it"
                echo "- $n (target files absent from this tree)" >> "$RUNNER_TEMP/skipped.txt"
              else
                echo "::error::Droidspaces patch failed to apply: $n"
                echo "::error::All of its target files exist, so the hunk genuinely did not apply."
                exit 1
              fi
            fi
          done
          [ "$found" = 1 ] || { echo "::error::no Droidspaces patches found"; exit 1; }

      # Vestigial now that MEMCG is off: mm/page_counter.c is no longer compiled,
      # so nothing consumes data_race(). Kept because it is a no-op by
      # construction ("#ifndef data_race" + the macro expands to the expression
      # unchanged) and because re-enabling MEMCG would otherwise break the build
      # again: page_counter.c uses data_race() and this tree never defined it.
      - name: Compatibility fix (data_race) for CONFIG_MEMCG
        run: |
          set -euo pipefail
          cd ksrc
          if grep -q 'data_race' mm/page_counter.c && ! grep -rqE '^[[:space:]]*#[[:space:]]*define[[:space:]]+data_race' include/; then
            H=include/linux/compiler.h
            n=$(grep -n '^#endif.*__LINUX_COMPILER_H' "$H" | tail -n 1 | cut -d: -f1 || true)
            [ -n "$n" ] || { echo "::error::cannot find end of $H"; exit 1; }
            awk -v n="$n" 'NR==n{print "#ifndef data_race"; print "#define data_race(expr) ({ typeof(expr) __v = (expr); __v; })"; print "#endif"} {print}' "$H" > /tmp/compiler.h.new
            cp /tmp/compiler.h.new "$H"
            echo "Added data_race() to $H"
          else
            echo "data_race fix not needed"
          fi

      - name: Cache toolchain
        id: tc
        uses: actions/cache@v5
        with:
          path: ~/neutron-clang
          key: neutron-clang-06092026

      - name: Install deps
        run: bash authorci/build.sh --setup-deps

      - name: Fetch toolchain
        if: steps.tc.outputs.cache-hit != 'true'
        env:
          COMP_OPTION: llvm
          TG_UPLOAD: "false"
        run: bash authorci/build.sh --fetch-toolchains

      # GitHub runs 'run' steps with 'bash -e'. This step uses diff/grep
      # pipelines that legitimately return non-zero, so -e is turned off and
      # the final line decides pass/fail.
      - name: Verify Droidspaces + KSU config BEFORE compiling
        run: |
          set +e
          set -u
          source "$GITHUB_WORKSPACE/authorci/env-llvm.sh"
          clang --version | head -n 1 || { echo "::error::clang not found in toolchain"; exit 1; }
          cd ksrc
          M="make ARCH=arm64 LLVM=1 LLVM_IAS=1 O=out"
          $M vendor/asus/X00TD_defconfig vendor/extra/ksu.config vendor/extra/droidspaces.config > /tmp/cfg.log 2>&1 || {
            tail -n 40 /tmp/cfg.log; echo "::error::defconfig failed"; exit 1; }

          bad=0
          # must-have: containers cannot start / limits silently disappear without these
          for s in \
            SYSCTL SYSVIPC POSIX_MQUEUE NAMESPACES PID_NS UTS_NS IPC_NS NET_NS USER_NS \
            SECCOMP SECCOMP_FILTER CGROUPS CGROUP_DEVICE CGROUP_SCHED \
            CGROUP_FREEZER CGROUP_NET_PRIO CGROUP_PIDS CGROUP_CPUACCT \
            DEVTMPFS OVERLAY_FS TMPFS_POSIX_ACL TMPFS_XATTR FW_LOADER FW_LOADER_USER_HELPER \
            VETH BRIDGE BRIDGE_NETFILTER NETFILTER NETFILTER_ADVANCED NF_CONNTRACK \
            IP_NF_IPTABLES IP_NF_FILTER NF_NAT NF_TABLES IP_NF_TARGET_MASQUERADE \
            NETFILTER_XT_TARGET_TCPMSS NETFILTER_XT_MATCH_ADDRTYPE NF_NAT_REDIRECT \
            IP_ADVANCED_ROUTER IP_MULTIPLE_TABLES NF_NAT_IPV4 IP_NF_NAT \
            IPV6 IPV6_MULTIPLE_TABLES IP6_NF_IPTABLES IP6_NF_FILTER IP6_NF_MANGLE \
            IP6_NF_NAT IP6_NF_TARGET_MASQUERADE NF_NAT_IPV6 \
            MACVLAN FUSE_FS TUN BLK_DEV_LOOP EXT4_FS \
            KSU ANDROID_SIMPLE_LMK CPU_FREQ_DEFAULT_GOV_PERFORMANCE ; do
            if ! grep -qx "CONFIG_$s=y" out/.config; then echo "::error::MISSING required CONFIG_$s"; bad=1; fi
          done

          # ANDROID_SIMPLE_LMK is the ONLY low-memory killer this ROM can use:
          # there is no PSI (# CONFIG_PSI is not set) and no legacy
          # ANDROID_LOW_MEMORY_KILLER in this tree, so if it disappears the
          # kernel kills nothing and the phone reclaims itself to death (minutes
          # at the boot splash, then a freeze -- what the 2026-10-17 builds did).
          # It has "depends on !ANDROID_LOW_MEMORY_KILLER && !MEMCG && !PSI"
          # (drivers/android/Kconfig:78), and when the dependency breaks kconfig
          # drops the symbol SILENTLY -- there is no "is not set" line to find.
          # So assert both halves: the killer is on, and both of its blockers
          # are off. Do not remove MEMCG from this list to get "--memory" back.
          echo "--- low memory killer ---"
          grep -E '^(CONFIG_ANDROID_SIMPLE_LMK|CONFIG_MEMCG|CONFIG_PSI|CONFIG_ANDROID_LOW_MEMORY_KILLER)' out/.config \
            || echo "(no LMK/MEMCG/PSI symbol at all)"
          for s in MEMCG PSI ANDROID_LOW_MEMORY_KILLER; do
            if grep -qx "CONFIG_$s=y" out/.config; then
              echo "::error::CONFIG_$s must stay off on this kernel: it silently disables CONFIG_ANDROID_SIMPLE_LMK, leaving the phone with no low-memory killer (that is the 2026-10-17 slow-boot + freeze bug)"
              bad=1
            fi
          done
          if ! grep -qx 'CONFIG_ANDROID_SIMPLE_LMK=y' out/.config; then
            echo "::error::CONFIG_ANDROID_SIMPLE_LMK did not survive the merge; refusing to ship a kernel with no low-memory killer"
            bad=1
          fi

          # SuSFS is off by request (NoMount is the metamodule replacement).
          # Fail closed if anything drags it back in.
          if grep -qE '^CONFIG_KSU_SUSFS' out/.config; then
            echo "::error::CONFIG_KSU_SUSFS* got enabled; this build is supposed to ship without SuSFS"
            bad=1
          fi

          # FAIR_GROUP_SCHED / CFS_BANDWIDTH must stay OFF. The fair.c code under
          # "#ifdef CONFIG_CFS_BANDWIDTH" is a broken half-merged graft that has
          # never compiled (RSKSeven's defconfig ships FAIR_GROUP_SCHED=n). If a
          # future defconfig starts selecting it, fail here with an explanation
          # instead of dying 20 minutes later inside unthrottle_cfs_rq.
          for s in FAIR_GROUP_SCHED CFS_BANDWIDTH; do
            if grep -qx "CONFIG_$s=y" out/.config; then
              echo "::error::CONFIG_$s got enabled; kernel/sched/fair.c does not compile with it on this tree"
              bad=1
            fi
          done

          # A pernet_operations object that is registered during boot must NOT be
          # placed in .init.data. free_initmem() unmaps the entire __init region
          # (arch/arm64/mm/init.c -> unmap_kernel_range), so the first runtime walk
          # of pernet_list dereferences unmapped memory. On Android that first walk
          # is the first network-namespace creation -- i.e. the first LXC/Droidspaces
          # container -- and ops_init() then oopses, which CONFIG_PANIC_ON_OOPS +
          # PANIC_TIMEOUT=1 turn into an instant reboot with no trace on screen.
          # net/ipv4/ping.c did exactly this ("static __initdata struct
          # pernet_operations ping_v4_net_ops"), and it is inherited from the CAF
          # base, so guard against it coming back.
          # __net_initdata / __net_initconst are the correct spellings: while
          # CONFIG_NET_NS=y they expand to nothing (the object stays in .data), and
          # only when there are no runtime namespaces do they mean __initdata
          # (include/net/net_namespace.h). Any other init attribute is a bug.
          pernet_bad=$(grep -rnE 'struct pernet_operations' --include='*.c' --include='*.h' . 2>/dev/null \
            | grep -E '__initdata|__initconst' | grep -vE '__net_initdata|__net_initconst' || true)
          if [ -n "$pernet_bad" ]; then
            echo "::error::a pernet_operations object is in freed + unmapped init memory; the first network-namespace creation (any Droidspaces/LXC container) would oops and reboot the phone"
            echo "$pernet_bad"
            bad=1
          else
            echo "pernet_operations objects: none placed in init memory"
          fi

          # KernelSU needs a hooking mechanism, not specifically kprobes.
          # drivers/kernelsu/Kconfig sets KSU_MANUAL_HOOK=y whenever KPROBES is
          # absent (this tree's defconfig never enables KPROBES, and neither does
          # the known-good kernel currently running on the device), while
          # KSU_KPROBES_HOOK=y is the kretprobe path used on 5.10+ and
          # KSU_SYSCALL_TABLE_HOOK=y (KSU-Next legacy HEAD only) patches
          # sys_call_table for non-GKI kernels. Exactly one must be on, or
          # KernelSU has no way to hook syscalls.
          echo "--- KSU hook mechanism ---"
          grep -E '^CONFIG_(KSU_MANUAL_HOOK|KSU_KPROBES_HOOK|KSU_SYSCALL_TABLE_HOOK|KPROBES|KRETPROBES)' out/.config
          if ! grep -qxE 'CONFIG_KSU_(MANUAL_HOOK|KPROBES_HOOK|SYSCALL_TABLE_HOOK)=y' out/.config; then
            echo "::error::no KSU hook mechanism is enabled (need one of MANUAL_HOOK / KPROBES_HOOK / SYSCALL_TABLE_HOOK)"; bad=1; fi

          # Note: CONFIG_ANDROID_PARANOID_NETWORK no longer exists on this CAF
          # 4.19 tree, so there is nothing to force off for container networking.

          echo "--- who won: seccomp (fragment must beat any defconfig override) ---"
          grep -E '^CONFIG_SECCOMP' out/.config

          echo "--- identity ---"
          grep -E '^CONFIG_LOCALVERSION|^CONFIG_CPU_FREQ_DEFAULT_GOV' out/.config
          if ! grep -qx 'CONFIG_LOCALVERSION="-MysticKernel"' out/.config; then
            echo "::error::LOCALVERSION is not -MysticKernel"; bad=1; fi
          if ! grep -qx 'CONFIG_CPU_FREQ_DEFAULT_GOV_PERFORMANCE=y' out/.config; then
            echo "::error::default governor is not performance (tree default; schedutil was deliberately reverted after the 2026-10-17 freezes)"; bad=1; fi

          echo "--- optional options that did not stick (informational) ---"
          grep -E '^CONFIG_.*=y$' arch/arm64/configs/vendor/extra/droidspaces.config | while read -r l; do
            grep -qx "$l" out/.config || echo "not set: $l"
          done

          echo "--- effective diff vs RSKSeven baseline (no fragment) ---"
          cp -a out /tmp/outfull
          rm -rf out
          $M vendor/asus/X00TD_defconfig vendor/extra/ksu.config > /tmp/base.log 2>&1 || {
            tail -n 40 /tmp/base.log; echo "::error::baseline defconfig failed"; exit 1; }
          grep -E '^(CONFIG_|# CONFIG_)' out/.config | sort > /tmp/base.cfg
          grep -E '^(CONFIG_|# CONFIG_)' /tmp/outfull/.config | sort > /tmp/new.cfg
          diff /tmp/base.cfg /tmp/new.cfg | grep '^[<>]' | head -n 80
          # Keep the merged config: this step deletes out/ just below, and having
          # the real merged .config in the artifacts is what makes a config
          # failure diagnosable without re-running the whole thing.
          cp /tmp/outfull/.config "$GITHUB_WORKSPACE/merged.config"
          rm -rf out /tmp/outfull
          if [ "$bad" != 0 ]; then echo "Config check FAILED"; exit 1; fi
          echo "Config check passed"

      - name: Build kernel and AnyKernel3 zip
        env:
          COMP_OPTION: llvm
          TG_UPLOAD: "false"
          KCFLAGS_W: "false"
          DEVICE_TARGET: X00TD
          EXTRA_CONFIG: vendor/extra/ksu.config vendor/extra/droidspaces.config
          MAKEFLAGS: -k
          # See the header: without this the kernel reports KSU_VERSION=1 and the
          # KernelSU-Next manager refuses to manage it (needs >= 33188).
          KSU_VERSION_OVERRIDE: "33314"
          KSU_VERSION_TAG_OVERRIDE: "v3.4.0-legacy"
        run: |
          set -euo pipefail
          sha=$(git -C ksrc rev-parse --short HEAD)
          export CI_ZIPNAME="X00TD-MysticKernel-$(date +%Y%m%d-%H%M)-$sha.zip"
          echo "ZIPNAME=$CI_ZIPNAME" >> "$GITHUB_ENV"
          echo "KSHA=$sha" >> "$GITHUB_ENV"
          LOG="$GITHUB_WORKSPACE/build.log"
          cd ksrc
          # MAKEFLAGS=-k keeps make going after an error, which is good for the
          # log but means a non-zero exit alone is not a reliable signal, and a
          # partial build can still link an Image.gz-dtb. So the captured log is
          # also scanned for compiler diagnostics and the run is aborted on any.
          set +e
          bash ../authorci/build.sh 2>&1 | tee "$LOG"
          rc=${PIPESTATUS[0]}
          set -e
          errs=$(grep -cE ': error:' "$LOG" || true)
          echo "build.sh exit code: $rc"
          echo "compiler 'error:' lines: $errs"
          if [ "$rc" != 0 ] || [ "$errs" != 0 ]; then
            echo "::error::build failed (exit=$rc, compiler errors=$errs)"
            grep -nE ': error:' "$LOG" | head -n 40 || true
            tail -n 40 "$LOG" || true
            exit 1
          fi

          # Fail-closed on the KSU version. Note upstream's Kbuild prints BOTH
          # lines: the "version fallback: 1" info line fires first (the vendored
          # copy has no .git of its own), then the override block reassigns
          # KSU_VERSION and the single ccflags-y is emitted after it, so the
          # override is what actually gets compiled - the fallback line is just
          # noise. Assert on the override line instead of on the fallback noise.
          ver=$(grep -oE "KernelSU-Next version override: [0-9]+" "$LOG" | tail -n 1)
          if [ "$ver" != "KernelSU-Next version override: $KSU_VERSION_OVERRIDE" ]; then
            echo "::error::KSU version pin did not take effect (found: '${ver:-none}')"
            grep -nE "KernelSU-Next (version|tag)" "$LOG" | head -n 5 || true
            exit 1
          fi
          echo "--- KernelSU-Next version compiled into the kernel ---"
          grep -E "KernelSU-Next (version|tag)" "$LOG" | sort -u

          test -s "$CI_ZIPNAME"
          unzip -l "$CI_ZIPNAME" | grep -E 'Image.gz-dtb|anykernel.sh'
          test -s out/arch/arm64/boot/Image.gz-dtb
          echo "OK: $CI_ZIPNAME"

          # Same netns bug as the pre-build source gate, but proven against the
          # built image instead of the source. System.map carries every symbol,
          # static data included, so we can assert outright that ping's
          # pernet_operations is not inside __init_begin..__init_end (the range
          # free_initmem() unmaps) -- the one thing that made every Droidspaces
          # container reboot the phone. Any other *_net_ops found there is only
          # reported, since that is the style of bug that could bite next.
          if [ ! -s out/System.map ]; then
            echo "::warning::out/System.map not found; skipping the pernet-init-memory symbol check"
          elif [ -z "$(awk '$3=="__init_end"{print $1; exit}' out/System.map)" ]; then
            echo "::warning::__init_end is missing from System.map; skipping the netns symbol check"
          else
            low48() { printf '%s' "${1: -12}"; }
            initb=$(awk '$3=="__init_begin"{print $1; exit}' out/System.map)
            inite=$(awk '$3=="__init_end"{print $1; exit}' out/System.map)
            ib=$((16#$(low48 "$initb"))); ie=$((16#$(low48 "$inite")))
            echo "System.map: __init_begin=$initb __init_end=$inite"
            pv=$(awk '$3=="ping_v4_net_ops"{print $1; exit}' out/System.map)
            if [ -n "$pv" ]; then
              pp=$((16#$(low48 "$pv")))
              if [ "$pp" -ge "$ib" ] && [ "$pp" -lt "$ie" ]; then
                echo "::error::ping_v4_net_ops ($pv) is inside __init (freed + unmapped): creating a network namespace would oops and reboot"
                exit 1
              fi
              echo "OK: ping_v4_net_ops ($pv) is outside the __init region"
            else
              echo "note: ping_v4_net_ops is not in System.map (CONFIG_PROC_FS off?) - nothing to check"
            fi
            while read -r a n; do
              v=$((16#$(low48 "$a")))
              if [ "$v" -ge "$ib" ] && [ "$v" -lt "$ie" ]; then
                echo "::warning::pernet symbol $n ($a) sits inside the __init region; registering it would oops the kernel on the first netns creation"
              fi
            done < <(awk '$3 ~ /_net_ops$/ {print $1, $3}' out/System.map) || true
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          {
            echo "## Mystic Kernel — X00TD (ASUS ZenFone Max Pro M1)"
            echo
            echo '`uname -r` should read `4.19.325-MysticKernel-'"$KSHA"'`'
            echo
            echo "Built from: $(git -C ksrc rev-parse HEAD)"
            echo
            echo "| Component | Version |"
            echo "| --- | --- |"
            echo "| Base | rusakseven/RSKSevenProject-X00TD-419 (rskseven-4.19) |"
            echo "| Linux | 4.19.325 |"
            echo "| Big cluster | 2.20 GHz (OC) |"
            echo "| Little cluster | 1.84 GHz (stock) |"
            echo "| Default governor | performance (stock; the ROM applies its own at runtime) |"
            echo "| GPU | locked 430 MHz |"
            echo "| Root | KernelSU-Next legacy HEAD 465490a26 (KSU 33314) |"
            echo "| SUSFS | disabled (use the NoMount metamodule) |"
            echo "| Low memory killer | Simple LMK (MINFREE 130 MiB) |"
            echo "| Containers | Droidspaces (full non-GKI config set) |"
            echo
            echo "### Flashing"
            echo "Flash the zip in OrangeFox. Back up your current boot.img first"
            echo "(OrangeFox -> Backup -> Boot) so you can restore it if anything misbehaves."
            echo
            echo "### Notes"
            echo "- Install the KernelSU-Next Manager v3.4.2 (versionCode 33355). Do not"
            echo "  use the old v3.2.x manager or the legacy KernelSU APK: the manager"
            echo "  refuses kernels that report a version below 33188."
            echo "- SUSFS is NOT compiled into this kernel (by request). For mount"
            echo "  hiding install the NoMount metamodule:"
            echo "  github.com/maxsteeel/nomount/releases."
            echo "- MEMCG is deliberately off. On this ROM it silently disables"
            echo "  ANDROID_SIMPLE_LMK, the only low-memory killer available here, which"
            echo "  is what made the 2026-10-17 builds crawl through boot and freeze."
            echo "  Consequence: Droidspaces' --memory limit is unavailable."
            echo "- Containers: starting a Droidspaces/LXC container used to oops the"
            echo "  kernel and reboot the phone. net/ipv4/ping.c kept ping_v4_net_ops"
            echo "  in .init.data, which free_initmem() frees and unmaps, so the first"
            echo "  runtime walk of pernet_list (the container's unshare(CLONE_NEWNET))"
            echo "  faulted inside ops_init(). The object now lives in .data, and CI"
            echo "  checks the built System.map so the bug class cannot come back."
            echo "- KernelSU-Next version in this kernel: 33314."
            echo "- The OC speedbin override is a no-op on units whose efuse already selects the 2.2 GHz LUT."
            if [ -s "$RUNNER_TEMP/skipped.txt" ]; then
              echo
              echo "### Droidspaces patches skipped"
              cat "$RUNNER_TEMP/skipped.txt"
            fi
          } > "$RUNNER_TEMP/notes.md"
          gh release create "X00TD-MysticKernel-$(date +%Y%m%d-%H%M)-$KSHA" \
            "ksrc/$ZIPNAME" --repo "$GITHUB_REPOSITORY" \
            --title "Mystic Kernel — X00TD — $ZIPNAME" --notes-file "$RUNNER_TEMP/notes.md"

      - name: Upload debug files
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: debug
          include-hidden-files: true
          path: |
            ksrc/out/.config
            ksrc/out/System.map
            ksrc/out/compilation.log
            build.log
            merged.config
          retention-days: 7
